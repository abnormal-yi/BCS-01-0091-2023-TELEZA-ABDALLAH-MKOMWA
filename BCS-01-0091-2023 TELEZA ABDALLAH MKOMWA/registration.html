        body {

        .registration-container {

  .registration-form {

  /* Row container */
  .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
  }

  /* Last row for password fields */
  .password-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
  }

  .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
  }

  .form-group label {
      font-weight: bold;
      color: #333;
      font-size: 14px;
      text-transform: uppercase;
  }

  .form-group input,
  .form-group select {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s ease;
  }

  .form-group input:focus,
  .form-group select:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 5px rgba(0,123,255,0.2);
  }

  .error-message {
      color: #ff0000;
      font-size: 12px;
      display: none;
  }

  .submit-btn {
      padding: 15px;
      background:  rgb(17, 42, 52);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 200px;
      margin: 0 auto;
      transition: background 0.3s ease, transform 0.2s ease;
  }

  .submit-btn:hover {
      background: rgb(17, 42, 52);
      transform: translateY(-2px);
  }

  /* Responsive design */
  @media (max-width: 768px) {
      .form-row, .password-row {
          grid-template-columns: 1fr;
      }
  }

    <section class="hero">
        <h1>Add Account</h1>
    </section>
    <div class="registration-container">
        <h2>Create Account</h2>
        <form id="registrationForm" class="registration-form" action="/register.php" method="POST">
            <!-- First Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="regNumber">Registration Number</label>
                    <input type="text" id="regNumber" name="regNumber" placeholder="BCS-00-0000-0000" required>
                    <span class="error-message" id="regError"></span>
                </div>
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Second Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="region">Region</label>
                    <select id="region" name="region" required>
                        <option value="">Select Region</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="district">District</label>
                    <select id="district" name="district" required>
                        <option value="">Select District</option>
                    </select>
                </div>
            </div>

            <!-- Third Row -->
            <div class="password-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <span class="error-message" id="passwordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>
</main>
